[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geeta-ai-engine"
version = "1.0.0-alpha.1"
description = "Enterprise AI Coding & Debugging Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
  { name = "Sadanand Vishwakarma" }
]

keywords = [
  "ai",
  "debugger",
  "agent",
  "automation",
  "llm",
  "python",
  "vscode"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License"
]

dependencies = [
  "PySide6>=6.8.0",
  "watchdog>=6.0.0",
  "loguru>=0.7.2",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "gitpython>=3.1.43",
  "httpx>=0.28.1",
  "websockets>=14.1",
  "python-dotenv>=1.0.1",
  "rich>=13.9.4",
  "orjson>=3.10.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "black>=24.10.0",
  "ruff>=0.8.2",
  "mypy>=1.13.0",
  "pre-commit>=4.0.1"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true